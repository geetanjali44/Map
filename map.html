
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>CEZOO Delivery Location</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  background:#fff;
  color:#111827;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

.header{
  padding:18px 18px 14px;
}

.logo{
  color:#087f5b;
  font-size:25px;
  font-weight:900;
}

.header h2{
  font-size:21px;
  margin-top:12px;
}

.header p{
  color:#777;
  font-size:13px;
  margin-top:6px;
}

/* SEARCH */

.search-area{
  padding:0 16px 15px;
  position:relative;
  z-index:1000;
}

.search-box{
  display:flex;
  align-items:center;
  background:#f5f6f7;
  border:1px solid #e5e7eb;
  border-radius:14px;
  overflow:hidden;
}

.search-box input{
  flex:1;
  min-width:0;
  height:52px;
  border:0;
  outline:0;
  background:transparent;
  padding:0 14px;
  font-size:14px;
}

.search-box button{
  margin:4px;
  padding:0 17px;
  height:43px;
  border:0;
  border-radius:10px;
  background:#087f5b;
  color:white;
  font-size:13px;
  font-weight:700;
}

.search-results{
  position:absolute;
  left:16px;
  right:16px;
  top:calc(100% - 15px);
  background:white;
  border-radius:14px;
  box-shadow:0 8px 30px #0002;
  max-height:300px;
  overflow-y:auto;
  z-index:9999;
}

.search-results[hidden]{
  display:none;
}

.search-item{
  display:block;
  width:100%;
  padding:15px;
  text-align:left;
  background:white;
  border:0;
  border-bottom:1px solid #eee;
  font-size:13px;
  line-height:1.5;
}

.search-item:hover{
  background:#eef8f2;
}

.search-message{
  padding:17px;
  color:#777;
  font-size:13px;
}

/* MAP */

.map-wrapper{
  width:100%;
  height:53dvh;
  min-height:340px;
  position:relative;
  background:#e5e7eb;
}

#map{
  width:100%;
  height:100%;
  z-index:1;
}

/* PIN */

.center-pin{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-100%);
  z-index:500;
  pointer-events:none;
}

.pin{
  width:43px;
  height:43px;
  background:#087f5b;
  border:3px solid white;
  border-radius:50% 50% 50% 4px;
  transform:rotate(-45deg);
  display:grid;
  place-items:center;
  box-shadow:0 4px 15px #0004;
}

.pin span{
  transform:rotate(45deg);
  color:white;
  font-size:22px;
}

.pin-shadow{
  width:17px;
  height:6px;
  background:#0004;
  border-radius:50%;
  margin:8px auto 0;
}

/* GPS */

.gps-btn{
  position:absolute;
  right:15px;
  bottom:25px;
  z-index:500;
  width:49px;
  height:49px;
  border:0;
  border-radius:50%;
  background:white;
  box-shadow:0 3px 15px #0003;
  font-size:25px;
  color:#087f5b;
}

.gps-btn:disabled{
  opacity:.6;
}

/* BOTTOM */

.bottom{
  position:relative;
  z-index:600;
  background:white;
  border-radius:24px 24px 0 0;
  margin-top:-15px;
  padding:22px 20px 30px;
  box-shadow:0 -5px 25px #00000010;
}

.status{
  display:flex;
  align-items:center;
  gap:13px;
  padding:17px;
  border-radius:15px;
  background:#eaf8f0;
}

.status-icon{
  width:43px;
  height:43px;
  flex-shrink:0;
  border-radius:50%;
  background:#087f5b;
  color:white;
  display:grid;
  place-items:center;
  font-size:23px;
  font-weight:bold;
}

.status h3{
  font-size:17px;
  color:#087f5b;
}

.status p{
  font-size:12px;
  color:#666;
  margin-top:5px;
  line-height:1.5;
}

.status.outside{
  background:#fff0f0;
}

.status.outside .status-icon{
  background:#e53935;
}

.status.outside h3{
  color:#e53935;
}

/* DETAILS */

.info-row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:17px 2px;
  border-bottom:1px solid #eee;
  font-size:13px;
}

.info-row span{
  color:#777;
}

.info-row strong{
  text-align:right;
  overflow-wrap:anywhere;
}

.confirm-btn{
  width:100%;
  height:54px;
  margin-top:20px;
  border:0;
  border-radius:13px;
  background:#087f5b;
  color:white;
  font-size:15px;
  font-weight:800;
}

.confirm-btn:disabled{
  background:#d5d5d5;
  color:#777;
  cursor:not-allowed;
}

.secondary-btn{
  width:100%;
  height:45px;
  margin-top:12px;
  border:0;
  border-radius:12px;
  background:#eef8f2;
  color:#087f5b;
  font-weight:700;
}

.debug{
  margin-top:18px;
  padding:15px;
  border-radius:12px;
  background:#f7f8f8;
  font-size:12px;
  line-height:2;
  overflow-wrap:anywhere;
}

.debug strong{
  color:#111;
}

.office-marker{
  width:20px;
  height:20px;
  background:#087f5b;
  border:4px solid white;
  border-radius:50%;
  box-shadow:0 0 0 5px #087f5b55;
}

</style>
</head>

<body>

<div class="header">

  <div class="logo">CEZOO</div>

  <h2>Select Delivery Location</h2>

  <p>Search or move the map to select your location</p>

</div>

<!-- SEARCH -->

<div class="search-area">

  <div class="search-box">

    <input
      id="searchInput"
      type="search"
      placeholder="Search area, street or landmark..."
      autocomplete="off"
    >

    <button id="searchBtn">
      Search
    </button>

  </div>

  <div
    class="search-results"
    id="searchResults"
    hidden
  ></div>

</div>

<!-- MAP -->

<div class="map-wrapper">

  <div id="map"></div>

  <div class="center-pin">

    <div class="pin">
      <span>●</span>
    </div>

    <div class="pin-shadow"></div>

  </div>

  <button
    class="gps-btn"
    id="gpsBtn"
    title="Use Current Location"
    aria-label="Use Current Location"
  >
    ◎
  </button>

</div>

<!-- BOTTOM -->

<div class="bottom">

  <div class="status" id="statusBox">

    <div class="status-icon" id="statusIcon">
      ✓
    </div>

    <div>

      <h3 id="statusTitle">
        Checking Location...
      </h3>

      <p id="statusDesc">
        Calculating delivery distance
      </p>

    </div>

  </div>

  <div class="info-row">

    <span>Distance from CEZOO</span>

    <strong id="distanceText">--</strong>

  </div>

  <div class="info-row">

    <span>Delivery Coverage</span>

    <strong>3 KM Radius</strong>

  </div>

  <button
    class="confirm-btn"
    id="confirmBtn"
    disabled
  >
    Confirm Delivery Location
  </button>

  <button
    class="secondary-btn"
    id="officeBtn"
  >
    View CEZOO Office
  </button>

  <!-- TEST DETAILS -->

  <div class="debug">

    <strong>LOCATION TEST</strong>

    <br>

    Office:
    <span id="officeCoords"></span>

    <br>

    Selected:
    <span id="selectedCoords"></span>

    <br>

    Distance:
    <span id="metersText"></span>

    <button
      class="secondary-btn"
      id="setOfficeBtn"
    >
      Set Office Here (Test Only)
    </button>

  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* ==========================================
   CEZOO OFFICE CONFIGURATION
========================================== */

/*
  Temporary Tanuku coordinates.

  Replace with exact office coordinates
  before production deployment.
*/

const DEFAULT_OFFICE = {
  lat:16.7475815,
  lng:81.6772241
};

const DELIVERY_RADIUS = 3000;

/* ==========================================
   OFFICE LOCATION
========================================== */

let office = {...DEFAULT_OFFICE};

/*
  Restore office position saved during
  testing in this browser.
*/

try{

  const saved =
    JSON.parse(
      localStorage.getItem(
        "cezoo_test_office"
      )
    );

  if(
    saved &&
    Number.isFinite(saved.lat) &&
    Number.isFinite(saved.lng)
  ){

    office = saved;

  }

}catch(error){

  console.warn(error);

}

/* ==========================================
   REAL OPENSTREETMAP
========================================== */

const map = L.map("map",{

  zoomControl:true,

  scrollWheelZoom:true

}).setView(

  [office.lat,office.lng],

  15

);

/* REAL MAP TILES */

L.tileLayer(

  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

  {

    maxZoom:19,

    attribution:
      '&copy; OpenStreetMap contributors'

  }

).addTo(map);

/* ==========================================
   OFFICE MARKER
========================================== */

const officeIcon = L.divIcon({

  className:"",

  html:'<div class="office-marker"></div>',

  iconSize:[20,20],

  iconAnchor:[10,10]

});

const officeMarker = L.marker(

  [office.lat,office.lng],

  {icon:officeIcon}

).addTo(map);

officeMarker.bindPopup(

  "<b>CEZONAL SOLUTIONS</b><br>CEZOO Office"

);

/* ==========================================
   3 KM DELIVERY CIRCLE
========================================== */

const deliveryCircle = L.circle(

  [office.lat,office.lng],

  {

    radius:DELIVERY_RADIUS,

    color:"#087f5b",

    weight:2,

    fillColor:"#12a36f",

    fillOpacity:0.13,

    dashArray:"7,6"

  }

).addTo(map);

/* ==========================================
   ELEMENTS
========================================== */

const $ = id =>
  document.getElementById(id);

const statusBox = $("statusBox");

const statusIcon = $("statusIcon");

const statusTitle = $("statusTitle");

const statusDesc = $("statusDesc");

const distanceText = $("distanceText");

const confirmBtn = $("confirmBtn");

const searchInput = $("searchInput");

const searchBtn = $("searchBtn");

const searchResults = $("searchResults");

const gpsBtn = $("gpsBtn");

/* ==========================================
   DISTANCE
========================================== */

function calculateDistance(lat,lng){

  return L.latLng(

    office.lat,

    office.lng

  ).distanceTo(

    L.latLng(lat,lng)

  );

}

/* ==========================================
   DELIVERY CHECK
========================================== */

function checkDelivery(){

  const selected = map.getCenter();

  const distance = calculateDistance(

    selected.lat,

    selected.lng

  );

  const km = distance / 1000;

  $("officeCoords").textContent =

    office.lat.toFixed(7)
    + ", "
    + office.lng.toFixed(7);

  $("selectedCoords").textContent =

    selected.lat.toFixed(7)
    + ", "
    + selected.lng.toFixed(7);

  $("metersText").textContent =

    distance.toFixed(0)
    + " meters";

  distanceText.textContent =

    km.toFixed(2)
    + " KM";

  /* WITHIN 3 KM */

  if(distance <= DELIVERY_RADIUS){

    statusBox.classList.remove(
      "outside"
    );

    statusIcon.textContent = "✓";

    statusTitle.textContent =
      "Delivery Available";

    statusDesc.textContent =
      "Great! CEZOO delivers to your selected location.";

    confirmBtn.disabled = false;

    confirmBtn.textContent =
      "Confirm Delivery Location";

  }

  /* OUTSIDE 3 KM */

  else{

    statusBox.classList.add(
      "outside"
    );

    statusIcon.textContent = "×";

    statusTitle.textContent =
      "Not Deliverable";

    statusDesc.textContent =
      "Sorry! CEZOO delivers only within 3 KM of our office.";

    confirmBtn.disabled = true;

    confirmBtn.textContent =
      "Outside Delivery Area";

  }

}

/* LIVE MAP UPDATE */

map.on("move",checkDelivery);

map.on("moveend",checkDelivery);

checkDelivery();

/* ==========================================
   LOCATION SEARCH
   OPENSTREETMAP NOMINATIM
========================================== */

let lastSearchTime = 0;

let searchSequence = 0;

const searchCache = new Map();

function showMessage(message){

  searchResults.hidden = false;

  searchResults.innerHTML = "";

  const div = document.createElement("div");

  div.className = "search-message";

  div.textContent = message;

  searchResults.appendChild(div);

}

/* SEARCH */

async function searchLocation(){

  const query = searchInput.value.trim();

  const requestId = ++searchSequence;

  if(query.length < 3){

    showMessage(
      "Enter at least 3 characters."
    );

    return;

  }

  showMessage(
    "Searching locations..."
  );

  searchBtn.disabled = true;

  try{

    const cacheKey =
      query.toLowerCase();

    let places;

    if(searchCache.has(cacheKey)){

      places = searchCache.get(cacheKey);

    }else{

      /*
        Public Nominatim rate limit:
        maximum 1 request per second.
      */

      const elapsed =
        Date.now() - lastSearchTime;

      if(elapsed < 1100){

        await new Promise(resolve=>

          setTimeout(
            resolve,
            1100-elapsed
          )

        );

      }

      if(requestId !== searchSequence){
        return;
      }

      lastSearchTime = Date.now();

      const params = new URLSearchParams({

        q:query,

        format:"jsonv2",

        addressdetails:"1",

        countrycodes:"in",

        limit:"10",

        viewbox:
          "81.45,16.95,81.95,16.45"

      });

      /*
        viewbox biases results near Tanuku.

        It does NOT restrict results
        to Tanuku.
      */

      const response = await fetch(

        "https://nominatim.openstreetmap.org/search?"
        + params.toString(),

        {
          headers:{
            "Accept":"application/json"
          }
        }

      );

      if(!response.ok){

        throw new Error(
          "Search request failed"
        );

      }

      places = await response.json();

      searchCache.set(
        cacheKey,
        places
      );

    }

    if(requestId !== searchSequence){
      return;
    }

    searchResults.innerHTML = "";

    if(!places.length){

      showMessage(
        "No locations found. Try a different name or move the map manually."
      );

      return;

    }

    places.forEach(place=>{

      const item =
        document.createElement("button");

      item.type = "button";

      item.className = "search-item";

      item.textContent =
        "⌖  " + place.display_name;

      item.addEventListener(
        "click",
        ()=>{

          const lat =
            Number(place.lat);

          const lng =
            Number(place.lon);

          if(
            !Number.isFinite(lat) ||
            !Number.isFinite(lng)
          ){
            return;
          }

          searchInput.value =
            place.display_name;

          searchResults.hidden = true;

          map.flyTo(

            [lat,lng],

            17,

            {
              animate:true,
              duration:1
            }

          );

        }
      );

      searchResults.appendChild(item);

    });

  }catch(error){

    console.error(error);

    if(requestId === searchSequence){

      showMessage(
        "Search unavailable. Please try again or select the location manually."
      );

    }

  }finally{

    if(requestId === searchSequence){

      searchBtn.disabled = false;

    }

  }

}

/* SEARCH BUTTON */

searchBtn.addEventListener(

  "click",

  searchLocation

);

/* ENTER KEY */

searchInput.addEventListener(

  "keydown",

  event=>{

    if(event.key === "Enter"){

      event.preventDefault();

      searchLocation();

    }

  }

);

/* CLOSE RESULTS */

map.on("dragstart",()=>{

  searchResults.hidden = true;

});

/* ==========================================
   USE CURRENT LOCATION
========================================== */

gpsBtn.addEventListener("click",()=>{

  if(!navigator.geolocation){

    alert(
      "Geolocation is not supported."
    );

    return;

  }

  if(!window.isSecureContext){

    alert(
      "Current location requires HTTPS or localhost."
    );

    return;

  }

  gpsBtn.disabled = true;

  gpsBtn.textContent = "…";

  navigator.geolocation.getCurrentPosition(

    position=>{

      gpsBtn.disabled = false;

      gpsBtn.textContent = "◎";

      const lat =
        position.coords.latitude;

      const lng =
        position.coords.longitude;

      searchInput.value = "";

      searchResults.hidden = true;

      map.flyTo(

        [lat,lng],

        17,

        {
          animate:true,
          duration:1
        }

      );

    },

    error=>{

      gpsBtn.disabled = false;

      gpsBtn.textContent = "◎";

      let message =
        "Unable to get current location.";

      if(error.code === 1){

        message =
          "Location permission denied. Please allow location access.";

      }else if(error.code === 2){

        message =
          "Location unavailable. Please enable GPS.";

      }else if(error.code === 3){

        message =
          "Location timed out. Please try again.";

      }

      alert(message);

    },

    {

      enableHighAccuracy:true,

      timeout:20000,

      maximumAge:0

    }

  );

});

/* ==========================================
   VIEW OFFICE
========================================== */

$("officeBtn").addEventListener(

  "click",

  ()=>{

    map.flyTo(

      [office.lat,office.lng],

      16

    );

  }

);

/* ==========================================
   SET OFFICE — TEST ONLY
========================================== */

$("setOfficeBtn").addEventListener(

  "click",

  ()=>{

    const selected = map.getCenter();

    const approved = confirm(

      "Set this pin as CEZOO office for testing?"

    );

    if(!approved){
      return;
    }

    office = {

      lat:selected.lat,

      lng:selected.lng

    };

    officeMarker.setLatLng(

      [office.lat,office.lng]

    );

    deliveryCircle.setLatLng(

      [office.lat,office.lng]

    );

    localStorage.setItem(

      "cezoo_test_office",

      JSON.stringify(office)

    );

    checkDelivery();

    alert(

      "Office location saved!\n\n" +

      "Latitude: " + office.lat +

      "\nLongitude: " + office.lng +

      "\n\nCopy these coordinates for production."

    );

  }

);

/* ==========================================
   CONFIRM LOCATION
========================================== */

confirmBtn.addEventListener(

  "click",

  ()=>{

    const selected = map.getCenter();

    const distance =
      calculateDistance(

        selected.lat,

        selected.lng

      );

    /*
      Validate again before confirmation.
    */

    if(distance > DELIVERY_RADIUS){

      checkDelivery();

      return;

    }

    const locationData = {

      latitude:selected.lat,

      longitude:selected.lng,

      distanceMeters:distance,

      deliverable:true

    };

    sessionStorage.setItem(

      "cezoo_delivery_location",

      JSON.stringify(locationData)

    );

    console.log(

      "CEZOO LOCATION",

      locationData

    );

    alert(

      "Location Confirmed!\n\n" +

      "Latitude: " + selected.lat +

      "\nLongitude: " + selected.lng +

      "\nDistance: " +

      (distance/1000).toFixed(2) +

      " KM"

    );

  }

);

/* ==========================================
   MAP SIZE FIX
========================================== */

window.addEventListener("load",()=>{

  setTimeout(()=>{

    map.invalidateSize();

  },300);

});

window.addEventListener("resize",()=>{

  map.invalidateSize();

});

</script>

</body>
</html>
